const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

// 背景:?bg=00ff00 填纯绿(给直播伴侣绿幕抠图用);不带参数=透明(手机/OBS浏览器源用)
let BG=new URLSearchParams(location.search).get('bg');
addEventListener('keydown',e=>{ if(e.key==='g'||e.key==='G') BG=(BG?null:'00ff00'); });

// 音高范围
let pit=DATA.notes.map(n=>n.m); const MLO=Math.min(...pit)-2, MHI=Math.max(...pit)+2;
// 时钟:从首行前几秒开始,循环
const FIRST=DATA.lines[0].t, LAST=DATA.lines[DATA.lines.length-1].t+DATA.lines[DATA.lines.length-1].d;
let playing=true, curMs=Math.max(0,FIRST-3000), last=performance.now();
addEventListener('keydown',e=>{
  if(e.key===' '){playing=!playing;e.preventDefault();}
  if(e.key==='ArrowRight')curMs+=5000;
  if(e.key==='ArrowLeft')curMs=Math.max(0,curMs-5000);
});
cv.addEventListener('click',()=>playing=!playing);

function midiY(m,top,h){const r=(m-MLO)/Math.max(1,MHI-MLO);return top+h-r*h;}
function shadow(){ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=6;ctx.shadowOffsetX=0;ctx.shadowOffsetY=2;}
function noShadow(){ctx.shadowColor='transparent';ctx.shadowBlur=0;}

function curLineIdx(now){let cur=-1;
  for(let i=0;i<DATA.lines.length;i++){const ln=DATA.lines[i];
    if(ln.t<=now&&now<ln.t+ln.d+400)cur=i; else if(ln.t>now)break;}
  if(cur<0){let prev=-1;for(let i=0;i<DATA.lines.length;i++){if(DATA.lines[i].t+DATA.lines[i].d<=now)prev=i;else break;}
    if(prev>=0&&prev+1<DATA.lines.length&&DATA.lines[prev+1].t-now<3000)return prev+1;}
  return cur;}

function drawPitch(now,y,h){
  const playhead=W*0.28, ppms=W/8000, pad=14, top=y+pad, bh=h-2*pad;
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(playhead,y+6);ctx.lineTo(playhead,y+h-6);ctx.stroke();
  for(const n of DATA.notes){
    const nx=playhead+(n.t-now)*ppms, nw=Math.max(3,n.d*ppms);
    if(nx+nw<0||nx>W)continue;
    const ny=midiY(n.m,top,bh), bar=Math.max(7,H*0.012), active=(n.t<=now&&now<=n.t+n.d);
    shadow();
    if(active){ctx.fillStyle='#50DCFF';rr(nx,ny-bar/2,nw,bar,4);ctx.fill();
      const pr=Math.min(1,Math.max(0,(now-n.t)/Math.max(1,n.d)));noShadow();
      ctx.fillStyle='#fff';rr(nx,ny-bar/2,nw*pr,bar,4);ctx.fill();}
    else{ctx.fillStyle='rgba(140,185,225,0.85)';rr(nx,ny-bar/2,nw,bar,4);ctx.fill();}
    noShadow();
  }
}
function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawWordLine(ln,cy,fs){
  ctx.font='bold '+fs+'px "Microsoft YaHei",sans-serif';ctx.textBaseline='middle';
  let total=0;for(const w of ln.w)total+=ctx.measureText(w.s).width;
  let cx=(W-total)/2;const now=curMs;
  for(const w of ln.w){const ww=ctx.measureText(w.s).width;
    let frac= now<w.t?0 : now>=w.t+w.d?1 : (now-w.t)/Math.max(1,w.d);
    shadow();ctx.fillStyle='rgba(240,240,240,0.95)';ctx.textAlign='left';ctx.fillText(w.s,cx,cy);noShadow();
    if(frac>0){ctx.save();ctx.beginPath();ctx.rect(cx,cy-fs,ww*frac,fs*2);ctx.clip();
      ctx.fillStyle='#50DCFF';ctx.fillText(w.s,cx,cy);ctx.restore();}
    cx+=ww;}
}
function drawPlain(text,cy,fs,alpha){
  ctx.font=fs+'px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  shadow();ctx.fillStyle='rgba(225,225,225,'+alpha+')';ctx.fillText(text,W/2,cy);noShadow();
}
function lineText(ln){return ln.w.map(w=>w.s).join('');}

function draw(){
  const now=performance.now();if(playing)curMs+=now-last;last=now;
  if(curMs>LAST+2000)curMs=Math.max(0,FIRST-3000); // 循环
  ctx.clearRect(0,0,W,H);
  if(BG){ctx.fillStyle='#'+BG;ctx.fillRect(0,0,W,H);}
  const ph=H*0.5;
  drawPitch(curMs,0,ph);
  const cur=curLineIdx(curMs);
  if(cur>=0){drawWordLine(DATA.lines[cur], ph+(H-ph)*0.36, Math.round(H*0.075));
    if(cur+1<DATA.lines.length)drawPlain(lineText(DATA.lines[cur+1]), ph+(H-ph)*0.74, Math.round(H*0.05),0.85);}
  else{let nxt=DATA.lines.findIndex(l=>l.t>curMs);
    if(nxt>=0)drawPlain('♪ '+Math.max(0,Math.round((DATA.lines[nxt].t-curMs)/1000))+'秒后  '+lineText(DATA.lines[nxt]),
      ph+(H-ph)*0.5, Math.round(H*0.05),0.8);}
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
