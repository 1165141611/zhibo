<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自动切镜 · 导播台模拟器</title>
<style>
  :root{
    --bg:#0c0e13; --panel:#151922; --panel2:#1c2230; --line:#2a3242;
    --txt:#e7ecf3; --dim:#8a94a6; --accent:#4ea1ff; --hot:#ff3b47; --ok:#37d67a;
    --intro:#7a6bff; --verse:#4ea1ff; --chorus:#ff5d8f; --interlude:#37c0d6; --outro:#f2a33c; --pause:#6b7688;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:13px}
  .app{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:14px;padding:14px;height:100%}
  @media(max-width:900px){.app{grid-template-columns:1fr;height:auto}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  h2{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;font-weight:600}

  /* 输出预览窗（3:4 竖屏） */
  .stage{display:flex;flex-direction:column;gap:12px}
  .preview{position:relative;width:100%;max-width:420px;aspect-ratio:3/4;margin:0 auto;
    border-radius:14px;overflow:hidden;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .camlayer{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
  .camlayer svg{display:block;width:100%;height:100%}
  .tally{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;
    background:rgba(0,0,0,.45);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .tally .dot{width:8px;height:8px;border-radius:50%;background:var(--hot);box-shadow:0 0 8px var(--hot)}
  .movetag{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);padding:5px 9px;
    border-radius:20px;font-size:11px;color:var(--accent)}
  /* KTV 叠层（模拟你现有绿幕字幕，浮在最上层不参与切镜） */
  .overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end}
  .titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;transition:opacity .6s;text-shadow:0 2px 8px #000}
  .titlecard .song{font-size:26px;font-weight:800}
  .titlecard .sub{font-size:13px;color:#cdd6e5}
  .lyric{padding:0 14px 26px;text-align:center}
  .lyric .line{font-size:22px;font-weight:800;-webkit-text-stroke:5px #000;paint-order:stroke;position:relative;display:inline-block}
  .lyric .fill{position:absolute;left:0;top:0;white-space:nowrap;overflow:hidden;color:#3aa0ff;-webkit-text-stroke:4px #fff;paint-order:stroke}
  .lyric .base{color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke}

  /* 右侧 */
  .right{display:flex;flex-direction:column;gap:12px;min-width:0}
  .mv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mvcam{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#000}
  .mvcam.active{border-color:var(--hot);box-shadow:0 0 0 2px rgba(255,59,71,.3)}
  .mvcam svg{width:100%;height:100%;display:block}
  .mvcam .lbl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));
    font-size:9.5px;padding:10px 5px 4px;line-height:1.25}
  .mvcam .lt{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#333}
  .mvcam.active .lt{background:var(--hot);box-shadow:0 0 8px var(--hot)}

  .transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f}
  button.warn{background:var(--outro);border-color:var(--outro);color:#1a1004}
  button.lock.on{background:var(--hot);border-color:var(--hot);color:#fff}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent}
  .seg button.on{background:var(--accent);color:#04121f}

  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{padding:5px 11px;border-radius:20px;font-weight:800;font-size:13px;color:#0a0d12}
  .clock{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
  .meter{height:8px;flex:1;min-width:100px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--outro),var(--hot));transition:width .08s}

  .timeline{position:relative;height:34px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:8px}
  .tlseg{position:absolute;top:0;bottom:0;opacity:.85}
  .tlcut{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.55}
  .tlhead{position:absolute;top:0;bottom:0;width:2px;background:var(--hot);box-shadow:0 0 6px var(--hot)}

  .log{height:150px;overflow:auto;background:#0a0c11;border:1px solid var(--line);border-radius:8px;
    padding:8px;font-family:"Cascadia Code",Consolas,monospace;font-size:11px;line-height:1.5}
  .log .cut{color:#ffb3bb} .log .move{color:#9fd0ff} .log .st{color:var(--dim)}
  .log b{color:#fff}

  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .ctrl{display:flex;flex-direction:column;gap:3px}
  .ctrl label{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
  .ctrl input[type=range]{width:100%}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .legend{font-size:11px;color:var(--dim);line-height:1.6}
  .legend .k{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px -1px 0}
  code{background:#0a0c11;padding:1px 5px;border-radius:4px;color:#9fd0ff;font-size:11px}
  input[type=file]{display:none}
  .muted{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 左：输出预览 ===== -->
  <div class="stage">
    <div class="card">
      <h2>输出（抖音竖屏 3:4）</h2>
      <div class="preview">
        <div class="camlayer" id="camlayer"></div>
        <div class="overlay">
          <div class="titlecard" id="titlecard">
            <div class="song" id="tcSong">演示曲 · 卧室 KTV</div>
            <div class="sub" id="tcSub">原唱：示例 · 演唱：主播名</div>
          </div>
          <div class="lyric" id="lyric"></div>
        </div>
        <div class="tally"><span class="dot"></span><span id="tallyName">CAM1</span></div>
        <div class="movetag" id="moveTag">静止</div>
      </div>
    </div>
    <div class="card">
      <h2>传输</h2>
      <div class="transport">
        <button class="primary" id="btnPlay">▶ 播放</button>
        <button id="btnRestart">⟲ 重来</button>
        <div class="seg" id="modeSeg">
          <button data-mode="demo" class="on">演示曲</button>
          <button data-mode="music">载入音乐</button>
          <button data-mode="live">接真实播放器</button>
        </div>
        <label for="file"><span class="muted">选择音频后自动切到「载入音乐」</span></label>
        <input type="file" id="file" accept="audio/*">
        <button class="lock" id="btnLock" title="自动切抽风时一键锁回主机">🔒 锁主机</button>
      </div>
      <div class="transport" id="liveRow" style="margin-top:8px;display:none">
        <span class="muted">pc-service：</span>
        <input id="liveHost" value="localhost:8765" spellcheck="false"
          style="width:150px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px">
        <button id="btnConnect">连接</button>
        <span id="liveStatus" class="muted">未连接</span>
        <span id="liveNow" class="muted"></span>
      </div>
      <div class="hud" style="margin-top:10px">
        <span class="chip" id="stateChip">—</span>
        <span class="clock" id="clock">0.0s / 0.0s</span>
        <div class="meter"><i id="energyBar"></i></div>
      </div>
      <div class="timeline" id="timeline"><div class="tlhead" id="tlhead"></div></div>
      <div class="legend" style="margin-top:8px">
        <span><i class="k" style="background:var(--intro)"></i>开场</span>
        <span><i class="k" style="background:var(--verse)"></i>主歌</span>
        <span><i class="k" style="background:var(--chorus)"></i>副歌</span>
        <span><i class="k" style="background:var(--interlude)"></i>间奏</span>
        <span><i class="k" style="background:var(--outro)"></i>尾奏</span>
        <span><i class="k" style="background:var(--pause)"></i>停</span>
      </div>
    </div>
  </div>

  <!-- ===== 右：导播台 ===== -->
  <div class="right">
    <div class="card">
      <h2>机位监视器（红框=当前直播画面）</h2>
      <div class="mv" id="mv"></div>
    </div>

    <div class="card">
      <h2>指令流（状态机 → OBS 实际下发的协议）</h2>
      <div class="log" id="log"></div>
    </div>

    <div class="card">
      <h2>护栏参数（实时可调）</h2>
      <div class="ctrls">
        <div class="ctrl"><label>主歌最短镜头 <b id="vHold">6.0s</b></label>
          <input type="range" id="pHoldV" min="2" max="12" step="0.5" value="6"></div>
        <div class="ctrl"><label>副歌最短镜头 <b id="vHoldC">4.0s</b></label>
          <input type="range" id="pHoldC" min="1.5" max="8" step="0.5" value="4"></div>
        <div class="ctrl"><label>间奏判定间隔 <b id="vGap">4.0s</b></label>
          <input type="range" id="pGap" min="2" max="8" step="0.5" value="4"></div>
        <div class="ctrl"><label>最小视角差 <b id="vAng">30°</b></label>
          <input type="range" id="pAng" min="0" max="90" step="5" value="30"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="row"><input type="checkbox" id="cbBreath" checked> 呼吸感（极慢微缩放）</label>
        <label class="row"><input type="checkbox" id="cbThirds" checked> 副歌用 1/3 构图前推</label>
      </div>
      <p class="legend" style="margin-top:8px">
        接真实系统时：<code>cut</code> → OBS <code>SetCurrentProgramScene</code>；
        <code>move</code> → Move 插件 / 定时 <code>SetSceneItemTransform</code>。
        本模拟用假机位底图代替真实摄像头，逻辑一致。
      </p>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   自动切镜模拟器
   - 三个假机位（SVG 底图）代替真实摄像头
   - 状态机(INTRO/VERSE/CHORUS/INTERLUDE/OUTRO/PAUSE)按护栏切镜+运镜
   - 演示曲：内置逐字时间轴+副歌标注，即开即看
   - 载入音乐：Web Audio 实时能量/起音分析，数据驱动切镜（无歌词时的代理）
   ========================================================================= */

const W=420,H=560; // 预览逻辑尺寸（比例即可）

/* ---------- 机位配置 ---------- */
const CAMS=[
  {id:'cam1',name:'CAM1 主·正前偏左·平视中景',short:'CAM1',angle:-20,face:[0.56,0.30]},
  {id:'cam2',name:'CAM2 右·近景特写',short:'CAM2',angle:40,face:[0.42,0.34]},
  {id:'cam3',name:'CAM3 高远·广角大全景',short:'CAM3',angle:0,face:[0.50,0.52]},
];
const CAM=Object.fromEntries(CAMS.map(c=>[c.id,c]));

// 各状态候选机位
function camsForState(s){
  switch(s){
    case 'INTRO':     return ['cam3'];
    case 'VERSE':     return ['cam1','cam2'];
    case 'CHORUS':    return ['cam2','cam3','cam1'];
    case 'INTERLUDE': return ['cam3'];
    case 'OUTRO':     return ['cam3'];
    case 'PAUSE':     return ['cam1'];
    default:          return ['cam1'];
  }
}

/* ---------- 假机位底图（3 个不同角度/景别的卧室 KTV） ---------- */
function svgScene(kind){
  // 公用：墙、地、KTV 氛围灯、窗、歌手
  const lights=`
    <radialGradient id="g_${kind}_a" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ff5d8f" stop-opacity=".55"/><stop offset="100%" stop-color="#ff5d8f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g_${kind}_b" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ea1ff" stop-opacity=".5"/><stop offset="100%" stop-color="#4ea1ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="g_${kind}_w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232a3a"/><stop offset="100%" stop-color="#141926"/></linearGradient>`;
  const singer=(cx,cy,sc,tone='#f0c8a4')=>`
    <g transform="translate(${cx},${cy}) scale(${sc})">
      <ellipse cx="0" cy="150" rx="120" ry="30" fill="#000" opacity=".25"/>
      <path d="M-70 150 Q-60 10 0 0 Q60 10 70 150 Z" fill="#2f3d6b"/>
      <path d="M-70 150 Q-60 40 0 30 Q60 40 70 150 Z" fill="#3a4d86" opacity=".7"/>
      <circle cx="0" cy="-42" r="40" fill="${tone}"/>
      <path d="M-40 -55 Q0 -100 40 -55 Q42 -70 0 -78 Q-42 -70 -40 -55Z" fill="#2a2320"/>
      <rect x="-6" y="-8" width="12" height="46" rx="6" fill="#3a3a44" transform="rotate(-24)"/>
      <circle cx="-20" cy="-20" r="11" fill="#3a3a44"/>
    </g>`;
  if(kind==='cam1'){ // 正前偏左·中景：人偏右、暖调
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs>${lights}</defs>
      <rect width="${W}" height="${H}" fill="url(#g_cam1_w)"/>
      <rect width="${W}" height="${H}" fill="url(#g_cam1_a)"/><rect width="${W}" height="${H}" fill="url(#g_cam1_b)"/>
      <rect y="${H*0.72}" width="${W}" height="${H*0.28}" fill="#0f1420"/>
      <rect x="30" y="120" width="70" height="150" rx="6" fill="#1a2233" opacity=".8"/>
      ${singer(W*0.58,H*0.42,1.15)}
      <text x="20" y="${H-16}" fill="#ffffff" opacity=".08" font-size="26" font-weight="800">CAM1</text></svg>`;
  }
  if(kind==='cam2'){ // 右·近景特写：人偏左、脸大
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs>${lights}</defs>
      <rect width="${W}" height="${H}" fill="url(#g_cam2_w)"/>
      <rect width="${W}" height="${H}" fill="url(#g_cam2_a)"/><rect width="${W}" height="${H}" fill="url(#g_cam2_b)"/>
      ${singer(W*0.44,H*0.62,2.05,'#f3cba6')}
      <text x="20" y="${H-16}" fill="#ffffff" opacity=".08" font-size="26" font-weight="800">CAM2</text></svg>`;
  }
  // cam3 高远·广角大全景：人小、显房间
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs>${lights}</defs>
      <rect width="${W}" height="${H}" fill="url(#g_cam3_w)"/>
      <rect width="${W}" height="${H}" fill="url(#g_cam3_a)"/><rect width="${W}" height="${H}" fill="url(#g_cam3_b)"/>
      <rect y="${H*0.66}" width="${W}" height="${H*0.34}" fill="#0e1320"/>
      <rect x="${W*0.62}" y="${H*0.30}" width="120" height="90" rx="6" fill="#0b1830"/>
      <rect x="${W*0.62}" y="${H*0.30}" width="120" height="90" rx="6" fill="url(#g_cam3_b)"/>
      <rect x="24" y="${H*0.5}" width="150" height="70" rx="10" fill="#1a2233"/>
      ${singer(W*0.5,H*0.52,0.9)}
      <text x="20" y="${H-16}" fill="#ffffff" opacity=".08" font-size="26" font-weight="800">CAM3</text></svg>`;
}

/* ---------- 演示曲：逐字时间轴 + 副歌标注 ---------- */
function buildDemoSong(){
  const words=[]; let t=5.0; // 0-5s 开场(无字)
  const push=(txt,n,dur)=>{for(let i=0;i<n;i++){words.push({text:txt[i%txt.length],tStart:t,tEnd:t+dur*0.9});t+=dur;}};
  push('轻轻的风吹过窗',7,0.55);  t+=0.6;      // 主歌1
  push('你的样子还在心上',8,0.5); t+=4.5;      // -> 间奏
  const c1=t; push('就这样看着你走',7,0.42);    // 副歌1
  push('走过我的春秋',7,0.42); const c1e=t; t+=5.0; // -> 间奏
  push('风又吹过山丘',7,0.5); t+=0.5;           // 主歌2
  push('岁月不肯回头',7,0.5); t+=4.0;
  const c2=t; push('就这样看着你走',7,0.4);      // 副歌2
  push('走过我的春秋',7,0.4);
  push('直到白了头',6,0.45); const c2e=t; t+=3.0; // 尾奏
  return {words, chorus:[{tStart:c1,tEnd:c1e},{tStart:c2,tEnd:c2e}], end:t+3, title:'演示曲 · 卧室 KTV', sub:'原唱：示例 · 演唱：主播名'};
}

/* ========================================================================= */
const state={
  mode:'demo', playing:false, t:0, dur:0,
  song:buildDemoSong(),
  activeCam:'cam1', lastCutT:-99, lastState:null, camOrderShuffle:{},
  framing:{z:1,cx:0.5,cy:0.5,ax:0.5,ay:0.5},           // 当前
  moveFrom:null,moveTo:null,moveStart:0,moveDur:0,moveEase:'inOutCubic',moveKind:null,
  locked:false, energy:0, energySm:0, eMax:0.02, eFloor:0.003,
  onsetCd:0, tlSegs:[], tlCuts:[], commands:[],
  guard:{holdV:6,holdC:4,gap:4,ang:30}, breath:true, thirds:true,
  // music-mode audio
  audio:null, actx:null, analyser:null, freqBuf:null, lastEnergy:0,
  // live 模式(接真实播放器 pc-service)
  connected:false, liveHost:'', liveT:0, liveDur:0, livePlaying:false, liveMid:null,
};

/* ---------- 建立机位 DOM ---------- */
const camlayer=document.getElementById('camlayer');
const mv=document.getElementById('mv');
CAMS.forEach(c=>{
  const d=document.createElement('div'); d.className='mvcam'; d.id='mv_'+c.id;
  d.innerHTML=svgScene(c.id)+`<div class="lt"></div><div class="lbl">${c.name}</div>`;
  mv.appendChild(d);
});
function setActiveCam(id){
  state.activeCam=id;
  camlayer.innerHTML=svgScene(id);
  document.getElementById('tallyName').textContent=CAM[id].short;
  CAMS.forEach(c=>document.getElementById('mv_'+c.id).classList.toggle('active',c.id===id));
}
setActiveCam('cam1');

/* ---------- 缓动 ---------- */
const ease={
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outCubic:x=>1-Math.pow(1-x,3),
  linear:x=>x,
};

/* ---------- 运镜：应用 framing 到 transform ---------- */
function applyFraming(f){
  // 把源上 (cx,cy) 放大 z 后落到输出 (ax,ay)
  const tx=(f.ax*W - f.cx*W*f.z);
  const ty=(f.ay*H - f.cy*H*f.z);
  camlayer.style.transform=`translate(${tx/W*100}%,${ty/H*100}%) scale(${f.z})`;
}
function startMove(kind,to,dur,easeName){
  state.moveFrom={...state.framing};
  state.moveTo={z:1,cx:0.5,cy:0.5,ax:0.5,ay:0.5,...to};
  state.moveStart=state.t; state.moveDur=dur; state.moveEase=easeName||'inOutCubic'; state.moveKind=kind;
  emit({cmd:'move',camera:state.activeCam,kind,
    framing:{from:round(state.moveFrom),to:round(state.moveTo)},dur:round1(dur),ease:state.moveEase,state:state.lastState});
  document.getElementById('moveTag').textContent=({push:'推近',pull:'拉远',pan:'平移',thirds:'1/3前推',breath:'呼吸'})[kind]||kind;
}
function tickMove(){
  if(!state.moveTo){return;}
  const p=Math.min(1,(state.t-state.moveStart)/state.moveDur);
  const e=ease[state.moveEase](p);
  const f={};for(const k of ['z','cx','cy','ax','ay'])f[k]=state.moveFrom[k]+(state.moveTo[k]-state.moveFrom[k])*e;
  state.framing=f;
  if(p>=1){state.moveTo=null; if(state.moveKind!=='breath')document.getElementById('moveTag').textContent='静止';}
}

/* ---------- 状态机 ---------- */
function currentState(t){
  if(!state.playing) return 'PAUSE';
  if(state.mode!=='music'){        // 演示曲 / 接真实播放器:都用逐字时间轴推导(真值)
    const s=state.song, w=s.words;
    if(!w||!w.length) return 'PAUSE';
    if(t<w[0].tStart) return 'INTRO';
    if(t>w[w.length-1].tEnd) return t<s.end?'OUTRO':'PAUSE';
    for(const c of s.chorus) if(t>=c.tStart&&t<=c.tEnd) return 'CHORUS';
    // 间奏：t 不在任何字内，且前一字结束到后一字开始的间隔 > gap
    // （必须排除"正唱在一个长音字中间"——否则真实 QRC 的长音会被误判成间奏）
    let prevEnd=-9,nextStart=1e9,inWord=false;
    for(const x of w){
      if(t>=x.tStart && t<=x.tEnd){ inWord=true; break; }
      if(x.tEnd<=t)prevEnd=Math.max(prevEnd,x.tEnd);
      if(x.tStart>=t)nextStart=Math.min(nextStart,x.tStart);
    }
    if(!inWord && prevEnd>=0 && nextStart-prevEnd>state.guard.gap && t>prevEnd && t<nextStart) return 'INTERLUDE';
    return 'VERSE';
  } else {
    // 音乐模式：能量代理
    const e=state.energySm, floor=state.eFloor, max=state.eMax;
    const sing=floor+0.13*(max-floor), chor=floor+0.55*(max-floor);
    if(t<1.2 && state.eMax<0.02) return 'INTRO';
    if(state.dur && t>state.dur-0.15) return 'PAUSE';
    if(e<sing){ // 低能量：区分开场/间奏/尾奏
      if(state.everSang && state.dur && t>state.dur*0.85) return 'OUTRO';
      if(!state.everSang) return 'INTRO';
      state.lowRun=(state.lowRun||0)+state.dt;
      return state.lowRun>state.guard.gap?'INTERLUDE':(state.lastState||'VERSE');
    }
    state.lowRun=0; state.everSang=true;
    return e>chor?'CHORUS':'VERSE';
  }
}

/* ---------- 起音检测（音乐模式）/ 字边界（演示模式）作为切点吸附 ---------- */
function isNearCutPoint(t){
  if(state.mode==='demo'){
    for(const w of state.song.words){ if(Math.abs(w.tStart-t)<0.12) return true; }
    return false;
  }else{
    // 能量上升沿 → 起音
    const rise=state.energySm-state.lastEnergy;
    return rise>0.006 && state.onsetCd<=0;
  }
}

/* ---------- 切镜决策 ---------- */
function planCut(s){
  if(state.locked){ if(state.activeCam!=='cam1'){doCut('cam1','locked',s);} return; }
  const minHold=(s==='CHORUS')?state.guard.holdC:state.guard.holdV;
  if(state.t-state.lastCutT < minHold) return;         // 护栏2 最短时长
  if(!isNearCutPoint(state.t)) return;                 // 护栏1 吸附字/起音
  let cand=camsForState(s).filter(id=>
    id!==state.activeCam &&                            // 护栏3 不连切同机
    Math.abs(CAM[id].angle-CAM[state.activeCam].angle)>=state.guard.ang); // 护栏4 视角差
  if(!cand.length) cand=camsForState(s).filter(id=>id!==state.activeCam);
  if(!cand.length) return;
  // 护栏3 加随机：按段落打乱，避免每次一样
  const pick=cand[Math.floor(pseudo(state.t)*cand.length)];
  doCut(pick,'auto',s);
}
function doCut(id,reason,s){
  setActiveCam(id); state.lastCutT=state.t; state.onsetCd=0.5;
  // 重置 framing（新机位从标准景别起）
  state.framing={z:1,cx:0.5,cy:0.5,ax:0.5,ay:0.5}; state.moveTo=null;
  emit({cmd:'cut',camera:id,transition:'cut',state:s,reason});
  // 副歌进入的目标机位轻推 / 1/3 前推
  if(s==='CHORUS'){
    const f=CAM[id].face;
    if(state.thirds) startMove('thirds',{z:1.28,cx:f[0],cy:f[1],ax:0.34,ay:0.42},1.6,'inOutCubic');
    else startMove('push',{z:1.18},1.6,'inOutCubic');
  }
}

/* ---------- 伪随机（可复现，按时间种子） ---------- */
function pseudo(t){const x=Math.sin(t*12.9898+state.commands.length*7.233)*43758.5453;return x-Math.floor(x);}

/* ---------- 指令流输出（= 协议） ---------- */
const logEl=document.getElementById('log');
function round(o){const r={};for(const k in o)r[k]=Math.round(o[k]*100)/100;return r;}
const round1=x=>Math.round(x*10)/10;
function emit(c){
  c.t=round1(state.t); state.commands.push(c);
  const cls=c.cmd;
  const body=c.cmd==='cut'
    ? `<b>cut</b> → ${c.camera} <span class="st">[${c.state}·${c.reason}]</span>`
    : `<b>move</b> ${c.camera} ${c.kind} z${c.framing.to.z} <span class="st">[${c.state} ${c.dur}s]</span>`;
  const div=document.createElement('div'); div.className=cls;
  div.innerHTML=`<span class="st">${c.t.toFixed(1)}s</span> ${body}`;
  logEl.appendChild(div); logEl.scrollTop=logEl.scrollHeight;
  if(state.commands.length>200) logEl.removeChild(logEl.firstChild);
}

/* ---------- 状态进入时的运镜（开场推/尾奏拉） ---------- */
function onStateEnter(s){
  if(s==='INTRO'){ state.framing={z:1.25,cx:0.5,cy:0.4,ax:0.5,ay:0.5,}; startMove('push',{z:1.0,cx:0.5,cy:0.5},4.0,'inOutCubic'); }
  if(s==='OUTRO'){ startMove('pull',{z:1.28,cx:0.5,cy:0.45},4.5,'inOutCubic'); }
  if(s==='INTERLUDE'){ startMove('pan',{z:1.08,cx:0.62,cy:0.5},3.5,'linear'); }
}

/* ---------- HUD / 时间轴 ---------- */
const STCOL={INTRO:'var(--intro)',VERSE:'var(--verse)',CHORUS:'var(--chorus)',INTERLUDE:'var(--interlude)',OUTRO:'var(--outro)',PAUSE:'var(--pause)'};
const STZH={INTRO:'开场',VERSE:'主歌',CHORUS:'副歌',INTERLUDE:'间奏',OUTRO:'尾奏',PAUSE:'停/说话'};
function updateHUD(s){
  const chip=document.getElementById('stateChip');
  chip.textContent=STZH[s]||s; chip.style.background=STCOL[s]||'#888';
  document.getElementById('clock').textContent=`${state.t.toFixed(1)}s / ${(state.dur||state.song.end).toFixed(1)}s`;
  const eN=Math.min(1,(state.energySm-state.eFloor)/((state.eMax-state.eFloor)||1));
  document.getElementById('energyBar').style.width=(Math.max(0,eN)*100)+'%';
  // 时间轴段
  const dur=state.dur||state.song.end;
  const tl=document.getElementById('timeline');
  if(state.tlSegs.length && state.tlSegs[state.tlSegs.length-1].s!==s){ state.tlSegs[state.tlSegs.length-1].e=state.t; state.tlSegs.push({s,start:state.t,e:state.t}); }
  else if(!state.tlSegs.length){ state.tlSegs.push({s,start:0,e:state.t}); }
  else state.tlSegs[state.tlSegs.length-1].e=state.t;
  // 重绘
  tl.querySelectorAll('.tlseg,.tlcut').forEach(n=>n.remove());
  for(const seg of state.tlSegs){ const d=document.createElement('div'); d.className='tlseg';
    d.style.left=(seg.start/dur*100)+'%'; d.style.width=Math.max(0,(seg.e-seg.start)/dur*100)+'%';
    d.style.background=STCOL[seg.s]; tl.insertBefore(d,tl.firstChild); }
  for(const ct of state.tlCuts){ const d=document.createElement('div'); d.className='tlcut'; d.style.left=(ct/dur*100)+'%'; tl.appendChild(d); }
  document.getElementById('tlhead').style.left=(state.t/dur*100)+'%';
}

/* ---------- KTV 字幕（演示模式） ---------- */
const lyricEl=document.getElementById('lyric'), titlecard=document.getElementById('titlecard');
function updateLyric(s){
  titlecard.style.opacity=(s==='INTRO')?1:0;
  const w=state.song.words;
  if(state.mode==='music' || s==='INTRO'||s==='PAUSE'||s==='OUTRO' || !w || !w.length){ lyricEl.innerHTML=''; return; }
  let line=null;
  if(state.song.lines && state.song.lines.length){       // 接真实播放器：用源歌词行（准确分行）
    for(const ln of state.song.lines){ const st=ln.start/1000, en=ln.end/1000;
      if(state.t>=st-1.2 && state.t<=en+1.0){ line=ln.chars.map(c=>({text:c.text,tStart:c.start/1000,tEnd:(c.start+c.dur)/1000})); break; } }
  } else {                                                 // 演示曲：按字间隔分行
    for(let i=0;i<w.length;i++){ if(state.t>=w[i].tStart-1.5 && state.t<=w[i].tEnd+1.2){
        let j=i; while(j>0 && w[j].tStart-w[j-1].tEnd<1.6)j--; let k=i; while(k<w.length-1 && w[k+1].tStart-w[k].tEnd<1.6)k++;
        line=w.slice(j,k+1); break; } }
  }
  if(!line||!line.length){ lyricEl.innerHTML=''; return; }
  const txt=line.map(x=>x.text).join('');
  // 进度
  let prog=0,acc=0; const total=line.length;
  for(let i=0;i<line.length;i++){ if(state.t>=line[i].tEnd)prog=i+1; else if(state.t>=line[i].tStart){prog=i+(state.t-line[i].tStart)/(line[i].tEnd-line[i].tStart);break;} }
  const pct=Math.min(100,prog/total*100);
  lyricEl.innerHTML=`<span class="line"><span class="base">${txt}</span><span class="fill" style="width:${pct}%">${txt}</span></span>`;
}

/* ---------- 主循环 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; state.dt=dt;
  let run=state.playing;
  if(state.mode==='live'){
    if(state.connected){ state.t=state.liveT; state.dur=state.liveDur||state.dur; state.playing=state.livePlaying; synthEnergy(); run=true; }
    else run=false;
  } else if(state.playing){
    if(state.mode==='music' && state.audio){ state.t=state.audio.currentTime; analyzeAudio(); }
    else { state.t+=dt; synthEnergy(); if(state.t>=(state.dur||state.song.end)){ togglePlay(false); } }
  }
  if(run){
    state.onsetCd-=dt; if(state.onsetCd<0)state.onsetCd=0;
    state.lastEnergy=state.energySm;

    const s=currentState(state.t);
    if(s!==state.lastState){ onStateEnter(s); state.lastState=s; }
    planCut(s);
    // 呼吸感（无其它运镜时的极慢微缩放）
    if(state.breath && !state.moveTo){ const b=1+0.012*Math.sin(state.t*1.1); state.framing.z=b; state.framing.ax=0.5;state.framing.ay=0.5;state.framing.cx=0.5;state.framing.cy=0.5; }
    tickMove(); applyFraming(state.framing);
    updateHUD(s); updateLyric(s);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 演示模式能量合成（驱动能量条+音乐感） ---------- */
function synthEnergy(){
  const s=currentState(state.t); let base=0.2;
  if(s==='CHORUS')base=0.9; else if(s==='VERSE')base=0.5; else if(s==='INTERLUDE')base=0.35; else base=0.08;
  // 逐字脉冲
  let pulse=0; for(const w of state.song.words){ if(state.t>=w.tStart&&state.t<=w.tEnd){ pulse=0.25*Math.sin((state.t-w.tStart)/(w.tEnd-w.tStart)*Math.PI);break; } }
  state.energy=base+pulse; state.energySm+=(state.energy-state.energySm)*0.2;
  state.eMax=Math.max(state.eMax*0.999,state.energySm); state.eFloor=0.05;
}

/* ---------- 音乐模式：真实音频分析 ---------- */
function analyzeAudio(){
  if(!state.analyser)return;
  state.analyser.getByteFrequencyData(state.freqBuf);
  let sum=0; for(let i=0;i<state.freqBuf.length;i++)sum+=state.freqBuf[i]*state.freqBuf[i];
  const rms=Math.sqrt(sum/state.freqBuf.length)/255;
  state.energy=rms; state.energySm+=(rms-state.energySm)*0.25;
  state.eMax=Math.max(state.eMax*0.9995,state.energySm);
  state.eFloor=Math.min(state.eFloor*1.0005+0.00001,state.energySm*0.5);
}

/* ---------- 控制 ---------- */
function togglePlay(force){
  state.playing=(force!==undefined)?force:!state.playing;
  document.getElementById('btnPlay').textContent=state.playing?'⏸ 暂停':'▶ 播放';
  if(state.mode==='music'&&state.audio){ if(state.playing){state.actx&&state.actx.resume();state.audio.play();}else state.audio.pause(); }
}
document.getElementById('btnPlay').onclick=()=>togglePlay();
document.getElementById('btnRestart').onclick=()=>{
  state.t=0; state.lastCutT=-99; state.lastState=null; state.tlSegs=[]; state.tlCuts=[]; state.commands=[];
  state.eMax=0.02; state.everSang=false; state.lowRun=0; logEl.innerHTML='';
  state.framing={z:1,cx:0.5,cy:0.5,ax:0.5,ay:0.5}; state.moveTo=null; setActiveCam('cam1');
  if(state.mode==='music'&&state.audio){state.audio.currentTime=0;}
  togglePlay(false);
};
document.getElementById('btnLock').onclick=e=>{ state.locked=!state.locked; e.target.classList.toggle('on',state.locked); };

document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  state.mode=b.dataset.mode;
  document.getElementById('liveRow').style.display = state.mode==='live'?'flex':'none';
  document.getElementById('btnPlay').disabled = state.mode==='live';   // 播放由真实播放器控制
  if(state.mode==='demo'){ state.song=buildDemoSong(); state.dur=state.song.end; }
  if(state.mode==='live'){ state.song={words:[],chorus:[],lines:[],notes:[],end:0}; state.liveMid=null; }
  document.getElementById('btnRestart').click();
  document.getElementById('tcSong').textContent = state.mode==='demo'?state.song.title:(state.mode==='music'?'你的音乐':'(未连接)');
});

/* ---------- 接真实播放器：pc-service WS(实时进度) + /song/{mid}/karaoke(逐字+音高) ---------- */
let liveWS=null;
const liveStatus=s=>document.getElementById('liveStatus').textContent=s;
function connectLive(){
  const host=document.getElementById('liveHost').value.trim().replace(/^https?:\/\//,'').replace(/\/+$/,'');
  state.liveHost=host;
  if(liveWS){ try{liveWS.close();}catch(e){} liveWS=null; }
  liveStatus('连接中…'); state.connected=false;
  let ws; try{ ws=new WebSocket('ws://'+host+'/ws'); }catch(e){ liveStatus('地址无效'); return; }
  liveWS=ws;
  ws.onopen=()=>{ state.connected=true; liveStatus('已连接 ✓'); };
  ws.onclose=()=>{ if(liveWS===ws){state.connected=false; liveStatus('已断开');} };
  ws.onerror=()=>{ liveStatus('连接失败（pc-service 没开？）'); };
  ws.onmessage=ev=>{
    let d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    if(d.type!=='state') return;
    state.liveT=(d.k_pos||0)/1000; state.liveDur=(d.k_dur||0)/1000; state.livePlaying=!!d.k_playing;
    document.getElementById('liveNow').textContent=d.k_title?('· ♪ '+d.k_title):'· (空闲)';
    if(d.k_mid && d.k_mid!==state.liveMid){ state.liveMid=d.k_mid; fetchTimeline(host,d.k_mid); }
  };
}
async function fetchTimeline(host,mid){
  liveStatus('拉取逐字/音高…');
  try{
    const r=await fetch('http://'+host+'/song/'+encodeURIComponent(mid)+'/karaoke');
    if(!r.ok){ liveStatus('该曲无 QRC（'+r.status+'）'); return; }
    const k=await r.json();
    const words=[];
    for(const ln of (k.lines||[])) for(const c of ln.chars) words.push({text:c.text,tStart:c.start/1000,tEnd:(c.start+c.dur)/1000});
    words.sort((a,b)=>a.tStart-b.tStart);
    const chorus=(k.chorus||[]).map(r=>({tStart:r[0]/1000,tEnd:r[1]/1000}));
    state.song={words,chorus,lines:k.lines||[],notes:k.notes||[],
      end:state.liveDur||(words.length?words[words.length-1].tEnd+3:0),title:mid};
    // 新歌 → 重置导播状态
    state.lastCutT=-99; state.lastState=null; state.tlSegs=[]; state.tlCuts=[]; state.commands=[]; logEl.innerHTML='';
    state.framing={z:1,cx:0.5,cy:0.5,ax:0.5,ay:0.5}; state.moveTo=null;
    liveStatus('已连接 ✓ · '+words.length+' 字 · '+(chorus.length?chorus.length+' 段副歌':'副歌未标注'));
    document.getElementById('tcSong').textContent=(document.getElementById('liveNow').textContent||mid).replace(/^· ♪ /,'');
  }catch(e){ liveStatus('取数失败（CORS/网络？）'); }
}
document.getElementById('btnConnect').onclick=connectLive;
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  if(!state.actx){ state.actx=new (window.AudioContext||window.webkitAudioContext)(); }
  const url=URL.createObjectURL(f);
  if(state.audio){state.audio.pause();}
  state.audio=new Audio(url); state.audio.crossOrigin='anonymous';
  const src=state.actx.createMediaElementSource(state.audio);
  state.analyser=state.actx.createAnalyser(); state.analyser.fftSize=1024;
  state.freqBuf=new Uint8Array(state.analyser.frequencyBinCount);
  src.connect(state.analyser); state.analyser.connect(state.actx.destination);
  state.audio.onloadedmetadata=()=>{ state.dur=state.audio.duration; };
  // 切到音乐模式
  document.querySelector('#modeSeg button[data-mode="music"]').click();
  document.getElementById('tcSong').textContent=f.name.replace(/\.[^.]+$/,'');
  document.getElementById('tcSub').textContent='数据驱动（能量/起音代理）· 演唱：主播名';
};

// 护栏滑块
const bind=(id,key,unit,fmt)=>{const el=document.getElementById(id);el.oninput=()=>{state.guard[key]=+el.value;document.getElementById(fmt).textContent=(+el.value).toFixed(unit==='°'?0:1)+unit;};};
bind('pHoldV','holdV','s','vHold'); bind('pHoldC','holdC','s','vHoldC'); bind('pGap','gap','s','vGap'); bind('pAng','ang','°','vAng');
document.getElementById('cbBreath').onchange=e=>state.breath=e.target.checked;
document.getElementById('cbThirds').onchange=e=>state.thirds=e.target.checked;

// 初始定格
state.dur=state.song.end;
setActiveCam('cam1'); applyFraming(state.framing);
</script>
</body>
